<title>Seguimiento de Inversiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003A70;
    --navy-mid:#2774AE;
    --orange:#FF6A14;
    --orange-dark:#E85B08;
    --ink:#485156;
    --muted:#6B767C;
    --faint:#9BA6AC;
    --line:#D3DCE2;
    --surface:#fff;
    --canvas:#EEF2F5;
    --tint:#F4F7F9;
    --tint-strong:#E4EBF0;
    --sidebar-tint:#8FB4D4;
    --sidebar-chip:#C8DCEC;
    --good:#1E7A54;
    --good-soft:#7FD1A8;
    --bad:#C0392B;
    --bad-soft:#FF9E8A;
    --bad-bg:#FBEAE7;
    --bad-bg-hover:#F7E4E1;
    --warn-bg:#FFF6F0;
    --warn-border:#FFD3B8;
    --warn-text:#B44A08;
    --warn-chip-bg:#FFE8DA;
    --neutral-chip:#E1E8EE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Montserrat',sans-serif;
    background:var(--canvas);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--navy-mid);text-decoration:none;}
  a:hover{color:var(--navy);}
  input,select,button{font-family:'Montserrat',sans-serif;}
  input:focus,select:focus,button:focus-visible,div[tabindex]:focus-visible{
    outline:2px solid var(--navy);
    outline-offset:1px;
  }
  ::placeholder{color:var(--faint);}
  button{cursor:pointer;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
  }

  .app-shell{display:flex;height:100vh;min-height:640px;color:var(--ink);}

  .sidebar{width:320px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;}
  .sidebar-head{padding:28px 24px 20px 24px;}
  .brand{font-family:'DM Sans',sans-serif;font-weight:700;font-size:20px;color:#fff;line-height:1.25;}
  .brand-sub{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--sidebar-tint);margin-top:6px;}

  .nav-row{padding:0 16px 16px 16px;}
  .nav-item{
    cursor:pointer;padding:13px 14px;border-radius:12px;display:flex;align-items:center;
    justify-content:space-between;gap:10px;transition:background 180ms cubic-bezier(0.22,0.61,0.36,1);
    background:transparent;border:none;width:100%;text-align:left;color:inherit;
  }
  .nav-item:hover{background:rgba(255,255,255,0.14);}
  .nav-item.is-active{background:rgba(255,255,255,0.16);}
  .nav-item-label{font-size:14px;font-weight:600;color:#fff;}
  .nav-item-hint{font-size:11px;color:var(--sidebar-tint);}

  .vehicles-head{padding:0 24px 14px 24px;display:flex;align-items:baseline;justify-content:space-between;}
  .vehicles-head-label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--sidebar-tint);}
  .vehicles-head-count{font-size:11px;color:var(--sidebar-tint);}

  .vehicle-list{flex:1;overflow-y:auto;padding:0 16px 16px 16px;display:flex;flex-direction:column;gap:6px;}
  .vehicle-nav{
    cursor:pointer;padding:14px 14px;border-radius:12px;display:flex;flex-direction:column;gap:8px;
    transition:background 180ms cubic-bezier(0.22,0.61,0.36,1);background:transparent;border:none;width:100%;text-align:left;color:inherit;
  }
  .vehicle-nav:hover{background:rgba(255,255,255,0.14);}
  .vehicle-nav.is-active{background:rgba(255,255,255,0.16);}
  .vehicle-nav-top{display:flex;align-items:flex-start;gap:10px;}
  .vehicle-nav-name{flex:1;min-width:0;font-size:14px;font-weight:600;color:#fff;line-height:1.35;overflow-wrap:anywhere;}
  .vehicle-nav-rend{font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .vehicle-nav-meta{display:flex;align-items:center;gap:8px;}
  .chip-type{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,0.12);color:var(--sidebar-chip);}
  .vehicle-nav-total{font-size:11px;color:var(--sidebar-tint);}

  .empty-sidebar{padding:18px 14px;border-radius:12px;border:1px dashed rgba(255,255,255,0.25);font-size:13px;line-height:1.5;color:var(--sidebar-chip);}

  .sidebar-foot{padding:16px 24px 24px 24px;border-top:1px solid rgba(255,255,255,0.14);}
  .btn-primary{
    width:100%;border:none;background:var(--orange);color:#fff;font-size:14px;font-weight:600;
    padding:13px 16px;border-radius:12px;transition:background 180ms cubic-bezier(0.22,0.61,0.36,1);
  }
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-primary:active{transform:scale(0.98);}
  .privacy-note{font-size:11px;line-height:1.5;color:var(--sidebar-tint);margin-top:14px;}

  .main{flex:1;min-width:0;overflow-y:auto;}
  .page{padding:40px 40px 56px 40px;max-width:1120px;animation:fadeIn 320ms cubic-bezier(0.22,0.61,0.36,1);}
  .eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  h1.page-title{font-family:'DM Sans',sans-serif;font-size:34px;font-weight:700;color:var(--navy);margin:12px 0 0 0;line-height:1.15;text-wrap:balance;}

  .currency-row{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap;}
  .currency-row-label{font-size:12px;color:var(--muted);}
  .currency-pill{cursor:pointer;border:1px solid var(--line);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;background:#fff;color:var(--ink);}
  .currency-pill.is-active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:26px;align-items:start;}
  .card{background:var(--surface);border-radius:20px;padding:26px;box-shadow:0 4px 12px rgba(0,58,112,0.08),0 1px 2px rgba(0,58,112,0.04);}
  .card-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .card-value{font-family:'DM Sans',sans-serif;font-size:clamp(24px,2.4vw,34px);font-weight:700;color:var(--navy);margin-top:10px;white-space:nowrap;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
  .card-note{font-size:12px;color:var(--muted);margin-top:6px;}

  .pie-wrap{display:flex;justify-content:center;margin:26px 0 6px 0;}
  .pie{position:relative;width:210px;height:210px;border-radius:50%;}
  .pie-hole{position:absolute;inset:56px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .pie-hole-num{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;color:var(--navy);}
  .pie-hole-label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .pie-note{font-size:12px;line-height:1.5;color:var(--muted);text-align:center;margin-top:12px;}

  .section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .section-head h2{font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--navy);font-weight:700;margin:0;}
  .section-head-hint{font-size:11px;color:var(--muted);}

  .row-list{display:flex;flex-direction:column;gap:6px;margin-top:16px;}
  .dash-row{
    cursor:pointer;display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:12px;
    transition:background 180ms cubic-bezier(0.22,0.61,0.36,1);background:transparent;border:none;width:100%;text-align:left;color:inherit;
  }
  .dash-row:hover{background:var(--tint);}
  .dash-row-dot{flex:none;width:12px;height:12px;border-radius:3px;}
  .dash-row-name{font-size:14px;font-weight:600;color:var(--navy);line-height:1.3;}
  .dash-row-type{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--faint);margin-top:3px;}
  .dash-row-amount{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .dash-row-pct{font-size:12px;color:var(--muted);margin-top:3px;text-align:right;font-variant-numeric:tabular-nums;}

  .empty-box{padding:26px 16px;text-align:center;font-size:13px;line-height:1.5;color:var(--muted);border:1px dashed var(--line);border-radius:12px;}
  .excluded-note{margin-top:18px;background:var(--tint);border-radius:12px;padding:14px 16px;font-size:12px;line-height:1.55;color:var(--muted);}

  .vehicle-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .vehicle-head-badges{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .chip-generic{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--neutral-chip);color:var(--ink);font-weight:600;}
  .chip-warn{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--warn-chip-bg);color:var(--warn-text);font-weight:600;}
  .vehicle-actions{display:flex;gap:8px;flex:none;}
  .btn-ghost{cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:600;padding:10px 14px;border-radius:12px;transition:border-color 180ms,color 180ms;}
  .btn-ghost:hover{border-color:var(--navy);color:var(--navy);}
  .btn-ghost.danger{color:var(--faint);}
  .btn-ghost.danger:hover{border-color:var(--bad);color:var(--bad);}

  .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:28px;}
  .stat-card{background:#fff;border-radius:20px;padding:22px 24px;box-shadow:0 4px 12px rgba(0,58,112,0.08),0 1px 2px rgba(0,58,112,0.04);}
  .stat-value{font-family:'DM Sans',sans-serif;font-size:clamp(22px,2.1vw,30px);font-weight:700;color:var(--navy);margin-top:12px;letter-spacing:-0.01em;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .stat-note{font-size:12px;color:var(--muted);margin-top:6px;}

  .warning-box{margin-top:16px;background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:12px;padding:14px 18px;font-size:13px;line-height:1.5;color:var(--warn-text);}

  .grid-records{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px;margin-top:32px;}
  .record-list{display:flex;flex-direction:column;gap:8px;margin-top:18px;}
  .record-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:var(--tint);}
  .record-amount{font-size:15px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;}
  .record-meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .btn-text{cursor:pointer;background:transparent;border:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px 8px;border-radius:8px;flex:none;}
  .btn-text:hover{color:var(--navy);background:var(--tint-strong);}
  .btn-text.danger:hover{color:var(--bad);background:var(--bad-bg-hover);}

  .roadmap-note{margin-top:28px;display:flex;align-items:flex-start;gap:14px;background:#E9EFF4;border-radius:16px;padding:18px 22px;}
  .roadmap-tag{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;color:var(--navy);flex:none;padding-top:2px;}
  .roadmap-text{font-size:13px;line-height:1.6;color:var(--ink);}

  .empty-state{height:100%;display:flex;align-items:center;justify-content:center;padding:48px;}
  .empty-state-inner{max-width:420px;text-align:center;}
  .empty-state h1{font-family:'DM Sans',sans-serif;font-size:28px;font-weight:700;color:var(--navy);margin:0;text-wrap:balance;}
  .empty-state p{font-size:14px;line-height:1.65;color:var(--muted);margin:14px 0 24px 0;text-wrap:pretty;}
  .btn-cta{cursor:pointer;background:var(--orange);border:none;color:#fff;font-size:14px;font-weight:600;padding:13px 22px;border-radius:12px;}
  .btn-cta:hover{background:var(--orange-dark);}

  .overlay{position:fixed;inset:0;background:rgba(0,58,112,0.55);display:flex;align-items:center;justify-content:center;padding:32px;animation:fadeIn 180ms cubic-bezier(0.22,0.61,0.36,1);z-index:40;}
  .overlay.is-confirm{z-index:50;}
  .modal{background:#fff;border-radius:20px;width:460px;max-width:100%;padding:28px;box-shadow:0 12px 32px rgba(0,58,112,0.24);animation:fadeUp 320ms cubic-bezier(0.22,0.61,0.36,1);}
  .modal.is-confirm{width:420px;}
  .modal h2{font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;color:var(--navy);margin:0;}
  .modal.is-confirm h2{font-size:20px;}
  .modal-sub{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;}
  .modal-body{font-size:14px;line-height:1.6;color:var(--ink);margin:12px 0 0 0;}
  .modal-fields{display:flex;flex-direction:column;gap:16px;margin-top:22px;}
  .field-group{display:flex;flex-direction:column;gap:14px;}
  .field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:var(--muted);}
  .field input,.field select{
    font-size:15px;color:var(--navy);padding:12px 14px;border:1px solid var(--line);border-radius:12px;
    font-weight:500;text-transform:none;letter-spacing:normal;background:#fff;
  }
  .field-row{display:flex;gap:12px;}
  .field-row .field:first-child{flex:1;}
  .field-row .field:last-child{width:130px;}
  .field-error{background:var(--bad-bg);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--bad);line-height:1.45;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:26px;}
  .btn-danger{cursor:pointer;background:var(--bad);border:none;color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:12px;}
  .btn-danger:hover{background:#A8301F;}
  .btn-danger:active{transform:scale(0.98);}
  .btn-save{cursor:pointer;background:var(--orange);border:none;color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:12px;}
  .btn-save:hover{background:var(--orange-dark);}
  .btn-save:active{transform:scale(0.98);}
  .btn-cancel{cursor:pointer;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:600;padding:12px 18px;border-radius:12px;}
  .btn-cancel:hover{border-color:var(--navy);color:var(--navy);}

  .stat-sub{font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
  .stat-sub strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
  .conv-note{font-size:11px;color:var(--faint);margin-top:4px;}

  .section-eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--navy);font-weight:700;margin:36px 0 0 0;}

  .chart-card{margin-top:20px;}
  .chart-empty{padding:30px 16px;text-align:center;font-size:13px;line-height:1.5;color:var(--muted);border:1px dashed var(--line);border-radius:12px;}
  .chart-svg{width:100%;height:auto;display:block;margin-top:14px;}
  .chart-legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;}
  .chart-legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
  .chart-legend-swatch{width:16px;height:0;border-top-width:2px;border-top-style:solid;}

  .field-hint{font-size:11px;color:var(--faint);text-transform:none;letter-spacing:normal;font-weight:500;margin-top:-2px;}

  .btn-link-sidebar{cursor:pointer;background:transparent;border:none;color:var(--sidebar-tint);font-size:11px;font-weight:600;padding:0;text-decoration:underline;text-underline-offset:2px;}
  .btn-link-sidebar:hover{color:#fff;}
  .export-row{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;}
  .import-error{font-size:11px;color:var(--bad-soft);margin-top:8px;line-height:1.4;}

  .stale-badge{font-size:9px;letter-spacing:0.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(255,106,20,0.28);color:#FFD9C4;margin-top:2px;display:inline-block;align-self:flex-start;}

  .rank-medal{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:var(--navy-mid);}
  .rank-pct{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
  .rank-xirr{font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;}

  .diversif-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .diversif-bar-wrap{flex:1;height:8px;background:var(--tint-strong);border-radius:999px;overflow:hidden;}
  .diversif-bar{height:100%;border-radius:999px;}
  .diversif-label{width:120px;flex:none;font-size:12px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .diversif-pct{width:52px;flex:none;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .subsection-h{font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--navy);font-weight:700;margin:0;}

  @media (max-width: 860px){
    .app-shell{flex-direction:column;height:auto;min-height:100vh;}
    .sidebar{width:100%;}
    .vehicle-list{max-height:220px;}
    .main{overflow-y:visible;}
    .page{padding:28px 20px 40px 20px;}
  }
</style>

<div id="app"></div>

<script>
(function(){
  "use strict";

  var KEY = 'seguimiento-inversiones-v1';
  var SYM = { COP: '$', USD: 'US$', GBP: '£' };
  var SLICE = ['#003A70', '#FF6A14', '#2774AE', '#5E7975', '#8FB4D4', '#B44A08', '#1E7A54', '#A9B7BF'];

  function uid(){ return Math.random().toString(36).slice(2, 9); }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function money(n, cur){
    var opts = cur === 'COP' ? { maximumFractionDigits: 0 } : { minimumFractionDigits: 2, maximumFractionDigits: 2 };
    return (SYM[cur] || cur) + ' ' + Number(n).toLocaleString('es-CO', opts) + ' ' + cur;
  }
  function shortMoney(n, cur){
    return (SYM[cur] || cur) + ' ' + Number(n).toLocaleString('es-CO', { maximumFractionDigits: 0 });
  }
  function parseDateStr(s){
    var p = String(s).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function dateText(s){
    return parseDateStr(s).toLocaleDateString('es-CO', { day: '2-digit', month: 'long', year: 'numeric' });
  }
  function dateTextFromDate(d){
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'long', year: 'numeric' });
  }
  function ageTextFromDays(days){
    if (days <= 0) return 'hoy';
    if (days === 1) return 'hace 1 día';
    if (days < 60) return 'hace ' + days + ' días';
    var m = Math.round(days / 30);
    if (m < 24) return 'hace ' + m + ' meses';
    return 'hace ' + (Math.round(days / 365 * 10) / 10).toString().replace('.', ',') + ' años';
  }
  function ageText(s){
    return ageTextFromDays(Math.round((Date.now() - parseDateStr(s).getTime()) / 86400000));
  }
  function currenciesOf(v){
    var set = {};
    v.aportes.concat(v.valoraciones).forEach(function(r){ set[r.currency] = 1; });
    return Object.keys(set);
  }
  function toCOP(r){
    if (r.currency === 'COP') return r.amount;
    if (r.fxRate) return r.amount * r.fxRate;
    return null;
  }
  function xnpv(rate, cfs, d0){
    return cfs.reduce(function(acc, cf){
      var days = (cf.date - d0) / 86400000;
      return acc + cf.amount / Math.pow(1 + rate, days / 365);
    }, 0);
  }
  function xirr(cfs){
    var sorted = cfs.slice().sort(function(a, b){ return a.date - b.date; });
    var d0 = sorted[0].date;
    var span = sorted[sorted.length - 1].date - d0;
    if (span <= 0) return null;
    var hasPos = sorted.some(function(c){ return c.amount > 0; });
    var hasNeg = sorted.some(function(c){ return c.amount < 0; });
    if (!hasPos || !hasNeg) return null;

    var rate = 0.1;
    for (var i = 0; i < 60; i++) {
      var f = xnpv(rate, sorted, d0);
      var df = (xnpv(rate + 1e-6, sorted, d0) - f) / 1e-6;
      if (Math.abs(df) < 1e-12) break;
      var next = rate - f / df;
      if (!isFinite(next) || next <= -0.999999) break;
      if (Math.abs(next - rate) < 1e-9) return next;
      rate = next;
    }

    var lo = -0.999999, hi = 10;
    var flo = xnpv(lo, sorted, d0), fhi = xnpv(hi, sorted, d0);
    if (flo * fhi > 0) return null;
    for (var j = 0; j < 200; j++) {
      var mid = (lo + hi) / 2;
      var fm = xnpv(mid, sorted, d0);
      if (Math.abs(fm) < 1e-6 || (hi - lo) < 1e-9) return mid;
      if ((flo < 0) === (fm < 0)) { lo = mid; flo = fm; } else { hi = mid; fhi = fm; }
    }
    return (lo + hi) / 2;
  }
  function summarize(v){
    var curs = currenciesOf(v);
    var mixed = curs.length > 1;
    var cur = curs[0] || 'COP';
    var totalsByCurrency = {};
    v.aportes.forEach(function(a){ totalsByCurrency[a.currency] = (totalsByCurrency[a.currency] || 0) + a.amount; });
    var total = totalsByCurrency[cur] || 0;
    var vals = v.valoraciones.slice().sort(function(a, b){ return parseDateStr(a.date) - parseDateStr(b.date); });
    var last = vals.length ? vals[vals.length - 1] : null;
    var rend = null;
    if (last && !mixed && total > 0) rend = (last.amount - total) / total;

    var xirrRate = null;
    if (!mixed && last && total > 0 && v.aportes.length > 0) {
      var cfs = v.aportes.map(function(a){ return { date: parseDateStr(a.date), amount: -a.amount }; });
      cfs.push({ date: parseDateStr(last.date), amount: last.amount });
      xirrRate = xirr(cfs);
    }

    var totalCOP = 0, totalCOPMissing = 0;
    v.aportes.forEach(function(a){
      var c = toCOP(a);
      if (c === null) totalCOPMissing++; else totalCOP += c;
    });
    var lastValCOP = last ? toCOP(last) : null;
    var lastValCOPMissing = !!(last && lastValCOP === null);
    var rendCOP = null;
    if (lastValCOP !== null && totalCOP > 0 && totalCOPMissing === 0) rendCOP = (lastValCOP - totalCOP) / totalCOP;

    return {
      curs: curs, mixed: mixed, cur: cur, total: total, totalsByCurrency: totalsByCurrency, last: last, rend: rend,
      xirrRate: xirrRate,
      totalCOP: totalCOP, totalCOPMissing: totalCOPMissing,
      lastValCOP: lastValCOP, lastValCOPMissing: lastValCOPMissing, rendCOP: rendCOP
    };
  }
  function totalText(v, s){
    var currs = Object.keys(s.totalsByCurrency);
    if (currs.length === 0) return '—';

  }
  function pct(r){

  function isSubjective(v){

  // ---------- Estado ----------
  var state = {

  function load(){

        var d = JSON.parse(raw);
        if (d && Array.isArray(d.vehicles)) {
          state.vehicles = d.vehicles;
          state.selectedId = d.vehicles.some(function(v){ return v.id === d.selectedId; }) ? d.selectedId : null;
          if (typeof d.view === 'string') state.view = d.view;

  function openModal(m){ state.modal = Object.assign({ error: '' }, m); render(); }
  function closeModal(){ state.modal = null; render(); }

  function saveModal(){
    var m = state.modal;
    if (!m) return;

    if (m.kind === 'vehicle') {
      var name = (document.getElementById('modal-name').value || '').trim();
      if (!name) { m.error = 'El vehículo necesita un nombre.'; render(); return; }
      var type = (document.getElementById('modal-type').value || '').trim() || 'Otro';
      if (m.editId) {
        state.vehicles = state.vehicles.map(function(v){
          return v.id === m.editId ? Object.assign({}, v, { name: name, type: type }) : v;
        });
        state.modal = null;
        persist(); render();
      } else {
        var nv = { id: uid(), name: name, type: type, aportes: [], valoraciones: [] };
        state.vehicles = state.vehicles.concat([nv]);
        state.modal = null;
        state.selectedId = nv.id;
        state.view = 'vehicle';
        persist(); render();
      }
      return;
    }

    var listKey = m.kind === 'aporte' ? 'aportes' : 'valoraciones';
    var date = document.getElementById('modal-date').value;
    if (!date) { m.error = 'Indique la fecha del registro.'; render(); return; }
    var rawAmount = String(document.getElementById('modal-amount').value || '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
    var amount = Number(rawAmount);
    if (!rawAmount || isNaN(amount)) { m.error = 'Escriba un monto numérico válido.'; render(); return; }
    if (amount <= 0) { m.error = 'El monto debe ser mayor que cero.'; render(); return; }
    var currency = document.getElementById('modal-currency').value;

    var fxRate;
    if (currency !== 'COP') {
      var fxEl = document.getElementById('modal-fxrate');
      var rawFx = fxEl ? String(fxEl.value || '').trim() : '';
      if (rawFx) {
        var fxNormalized = rawFx.replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
        var fxNum = Number(fxNormalized);
        if (isNaN(fxNum) || fxNum <= 0) { m.error = 'La tasa de cambio debe ser un número mayor que cero, o déjela vacía.'; render(); return; }
        fxRate = fxNum;
      }
    }

    state.vehicles = state.vehicles.map(function(v){
      if (v.id !== m.vehicleId) return v;
      var list;
      if (m.editId) {
        list = v[listKey].map(function(r){ return r.id === m.editId ? { id: r.id, date: date, amount: amount, currency: currency, fxRate: fxRate } : r; });
      } else {
        list = v[listKey].concat([{ id: uid(), date: date, amount: amount, currency: currency, fxRate: fxRate }]);
      }
      var patch = {}; patch[listKey] = list;
      return Object.assign({}, v, patch);
    });
    state.modal = null;
    persist(); render();

  // ---------- Cálculos de vista ----------
  function dashVals(){
    var byCur = {};
    state.vehicles.forEach(function(v){
      v.aportes.forEach(function(a){
        if (!byCur[a.currency]) byCur[a.currency] = {};
        byCur[a.currency][v.id] = (byCur[a.currency][v.id] || 0) + a.amount;
      });
    });
    var order = ['COP', 'USD', 'GBP'].filter(function(c){ return byCur[c]; })
      .concat(Object.keys(byCur).filter(function(c){ return ['COP', 'USD', 'GBP'].indexOf(c) < 0; }));
    var cur = (state.dashCurrency && byCur[state.dashCurrency]) ? state.dashCurrency : (order[0] || 'COP');
    var map = byCur[cur] || {};
    var total = Object.keys(map).reduce(function(s, k){ return s + map[k]; }, 0);
    var rows = state.vehicles.filter(function(v){ return map[v.id]; }).map(function(v){ return { v: v, amount: map[v.id] }; })
      .sort(function(a, b){ return b.amount - a.amount; })
      .map(function(e, i){
        return {

        };

    var acc = 0;
    var stops = rows.map(function(r){
      var from = acc;
      acc += total > 0 ? (r.amount / total * 100) : 0;
      return r.color + ' ' + from.toFixed(2) + '% ' + acc.toFixed(2) + '%';
    });
    var excluded = order.filter(function(c){ return c !== cur; });
    return {
      currencyLabel: cur,
      multiCurrency: order.length > 1,
      currencies: order.map(function(c){ return { label: c, active: c === cur }; }),
      totalText: rows.length ? money(total, cur) : '—',
      totalNote: rows.length ? 'Suma de todos los aportes registrados en ' + cur : 'Sin aportes registrados en ' + cur,
      pieGradient: rows.length ? 'conic-gradient(' + stops.join(', ') + ')' : '#E4EBF0',
      sliceCount: String(rows.length),

      rows: rows,

  function recordsOf(v, kind){

      };
    });

  function portfolioCOP(){
    var includedAportado = 0, includedValor = 0, vehiclesFull = 0;
    var excludedNames = [];
    state.vehicles.forEach(function(v){
      var s = summarize(v);
      var aporteOk = v.aportes.length > 0 && s.totalCOPMissing === 0;
      var valorOk = !!s.last && s.lastValCOP !== null;
      if (aporteOk && valorOk) {
        includedAportado += s.totalCOP;
        includedValor += s.lastValCOP;
        vehiclesFull++;
      } else if (v.aportes.length > 0 || s.last) {
        excludedNames.push(v.name);
      }
    });
    var rend = (vehiclesFull > 0 && includedAportado > 0) ? (includedValor - includedAportado) / includedAportado : null;
    return {
      includedAportado: includedAportado,
      includedValor: includedValor,
      vehiclesFull: vehiclesFull,
      totalVehicles: state.vehicles.length,
      excludedNames: excludedNames,
      rend: rend
    };
  }

  var STALE_DAYS = 90;
  function lastActivityDate(v){
    var dates = v.aportes.concat(v.valoraciones).map(function(r){ return parseDateStr(r.date).getTime(); });
    if (!dates.length) return null;
    return new Date(Math.max.apply(null, dates));
  }
  function daysSince(d){
    return Math.round((Date.now() - d.getTime()) / 86400000);
  }
  function isStale(v){
    var d = lastActivityDate(v);

  }
  function staleVehicles(){
    return state.vehicles.filter(isStale);
  }

  function comparisonRows(){
    var rows = state.vehicles
      .map(function(v){ return { v: v, s: summarize(v) }; })
      .filter(function(e){ return e.s.rend !== null; })
      .map(function(e){ return { id: e.v.id, name: e.v.name, type: e.v.type, rend: e.s.rend, xirrRate: e.s.xirrRate }; })
      .sort(function(a, b){
        var av = a.xirrRate !== null ? a.xirrRate : a.rend;
        var bv = b.xirrRate !== null ? b.xirrRate : b.rend;
        return bv - av;
      });
    return { rows: rows, excluded: state.vehicles.length - rows.length };
  }

  function diversification(){
    var byType = {}, byCurrency = {};
    var total = 0, missingCount = 0;
    state.vehicles.forEach(function(v){
      v.aportes.forEach(function(a){
        var cop = toCOP(a);
        if (cop === null) { missingCount++; return; }
        total += cop;
        byType[v.type] = (byType[v.type] || 0) + cop;
        byCurrency[a.currency] = (byCurrency[a.currency] || 0) + cop;
      });
    });
    function toRows(map){
      return Object.keys(map).map(function(k){ return { label: k, amount: map[k] }; })
        .sort(function(a, b){ return b.amount - a.amount; })
        .map(function(r, i){ return { label: r.label, amount: r.amount, pct: total > 0 ? r.amount / total * 100 : 0, color: SLICE[i % SLICE.length] }; });
    }
    var typeRows = toRows(byType);
    var curRows = toRows(byCurrency);
    return { total: total, missingCount: missingCount, typeRows: typeRows, curRows: curRows, topType: typeRows[0] || null };

  function shortDateLabel(d){
    return d.toLocaleDateString('es-CO', { day: '2-digit', month: 'short' });
  }

  function chartSeries(v, s){
    if (s.mixed) return null;
    if (!v.aportes.length && !v.valoraciones.length) return null;
    var aportesSorted = v.aportes.slice().sort(function(a, b){ return parseDateStr(a.date) - parseDateStr(b.date); });
    var cum = 0;
    var costPoints = aportesSorted.map(function(a){ cum += a.amount; return { date: parseDateStr(a.date), value: cum }; });
    var valPoints = v.valoraciones.slice().sort(function(a, b){ return parseDateStr(a.date) - parseDateStr(b.date); })
      .map(function(r){ return { date: parseDateStr(r.date), value: r.amount }; });
    return { costPoints: costPoints, valPoints: valPoints, cur: s.cur };
  }

  function renderChartSvg(series){
    var W = 640, H = 220, padTop = 16, padBottom = 30, padX = 6;
    var allDates = series.costPoints.concat(series.valPoints).map(function(p){ return p.date.getTime(); });
    var today = new Date();
    var minDate = Math.min.apply(null, allDates);
    var maxDate = Math.max.apply(null, allDates.concat([today.getTime()]));
    var span = Math.max(maxDate - minDate, 86400000);
    var allValues = series.costPoints.concat(series.valPoints).map(function(p){ return p.value; });
    var maxVal = Math.max.apply(null, allValues.concat([0])) * 1.12 || 1;

    function x(d){ return padX + ((d.getTime ? d.getTime() : d) - minDate) / span * (W - padX * 2); }
    function y(v2){ return padTop + (1 - v2 / maxVal) * (H - padTop - padBottom); }

    var costPath = '';
    if (series.costPoints.length) {
      costPath = 'M ' + x(series.costPoints[0].date) + ' ' + y(series.costPoints[0].value);
      for (var i = 1; i < series.costPoints.length; i++) {
        costPath += ' H ' + x(series.costPoints[i].date) + ' V ' + y(series.costPoints[i].value);
      }
      costPath += ' H ' + x(today);
    }
    var valPath = series.valPoints.map(function(p, i){
      return (i === 0 ? 'M ' : 'L ') + x(p.date) + ' ' + y(p.value);
    }).join(' ');

    var baseline = padTop + (H - padTop - padBottom);
    var circles = series.valPoints.map(function(p, i){
      var isLast = i === series.valPoints.length - 1;
      var r = isLast ? 5 : 3.5;
      return '<circle cx="' + x(p.date) + '" cy="' + y(p.value) + '" r="' + r + '" fill="#003A70" stroke="#fff" stroke-width="1.5">' +
        '<title>' + escapeHtml(dateTextFromDate(p.date)) + ': ' + escapeHtml(money(p.value, series.cur)) + '</title>' +
        '</circle>';
    }).join('');

    var firstLabel = shortDateLabel(new Date(minDate));
    var lastLabel = shortDateLabel(today);

    return '' +
      '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolución del valor y del capital aportado">' +
        '<line x1="' + padX + '" y1="' + baseline + '" x2="' + (W - padX) + '" y2="' + baseline + '" stroke="#D3DCE2" stroke-width="1"/>' +
        (costPath ? '<path d="' + costPath + '" fill="none" stroke="#FF6A14" stroke-width="2" stroke-dasharray="5 4"/>' : '') +
        (valPath ? '<path d="' + valPath + '" fill="none" stroke="#003A70" stroke-width="2.5"/>' : '') +
        circles +
        '<text x="' + padX + '" y="' + (H - 8) + '" font-size="11" fill="#9BA6AC" font-family="Montserrat, sans-serif">' + firstLabel + '</text>' +
        '<text x="' + (W - padX) + '" y="' + (H - 8) + '" font-size="11" fill="#9BA6AC" font-family="Montserrat, sans-serif" text-anchor="end">' + lastLabel + '</text>' +
      '</svg>';
  }

  function buildExportJSON(){
    return JSON.stringify({ exportedAt: new Date().toISOString(), vehicles: state.vehicles }, null, 2);
  }
  function csvEscape(val){
    var s = String(val == null ? '' : val);

    return s;
  }
  function buildExportCSV(){
    var rows = [['vehiculo', 'tipo', 'tipo_registro', 'fecha', 'monto', 'moneda', 'tasa_a_cop', 'monto_cop']];
    state.vehicles.forEach(function(v){
      v.aportes.forEach(function(r){ rows.push(csvRowOf(v, 'aporte', r)); });
      v.valoraciones.forEach(function(r){ rows.push(csvRowOf(v, 'valoracion', r)); });
    });
    return rows.map(function(row){ return row.map(csvEscape).join(','); }).join('\r\n');

  function csvRowOf(v, kind, r){

  function fallbackDownload(filename, content, mime){
    try {
      var blob = new Blob([content], { type: mime });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    } catch (e) { /* no se pudo exportar */ }
  }
  function downloadFile(filename, content, mime){
    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('downloads').then(function(downloads){
        if (!downloads) { fallbackDownload(filename, content, mime); return; }
        downloads.save({ filename: filename, data: content }).catch(function(){ /* el usuario canceló o falló */ });
      }).catch(function(){ fallbackDownload(filename, content, mime); });
    } else {
      fallbackDownload(filename, content, mime);
    }
  }

  function validImportRecord(r){
    return r && typeof r.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.date) &&
      typeof r.amount === 'number' && r.amount > 0 &&
      (r.currency === 'COP' || r.currency === 'USD' || r.currency === 'GBP');
  }
  function sanitizeImportRecord(r){
    var out = { id: (typeof r.id === 'string' && r.id) ? r.id : uid(), date: r.date, amount: r.amount, currency: r.currency };
    if (typeof r.fxRate === 'number' && r.fxRate > 0) out.fxRate = r.fxRate;
    return out;
  }
  function sanitizeImportVehicles(list){
    return list.filter(function(v){ return v && typeof v.name === 'string' && v.name.trim(); }).map(function(v){
      return {
        id: (typeof v.id === 'string' && v.id) ? v.id : uid(),
        name: v.name,
        type: (typeof v.type === 'string' && v.type.trim()) ? v.type : 'Otro',
        aportes: Array.isArray(v.aportes) ? v.aportes.filter(validImportRecord).map(sanitizeImportRecord) : [],
        valoraciones: Array.isArray(v.valoraciones) ? v.valoraciones.filter(validImportRecord).map(sanitizeImportRecord) : []
      };
    });
  }
  function handleImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var data;
      try { data = JSON.parse(reader.result); } catch (e) {
        state.importError = 'El archivo no es un JSON válido.';
        render();
        return;
      }
      if (!data || !Array.isArray(data.vehicles)) {
        state.importError = 'El archivo no tiene el formato esperado (debe ser un JSON exportado desde esta app).';
        render();
        return;
      }
      var sanitized = sanitizeImportVehicles(data.vehicles);
      if (!sanitized.length) {
        state.importError = 'El archivo no contiene vehículos válidos para importar.';
        render();
        return;
      }
      state.importError = '';
      state.confirm = {
        kind: 'import',
        importData: sanitized,
        title: 'Reemplazar todos los datos',
        body: 'Se reemplazarán los ' + state.vehicles.length + ' vehículo(s) actuales por los ' + sanitized.length + ' del archivo importado. Esta acción no se puede deshacer.'
      };
      render();
    };
    reader.onerror = function(){
      state.importError = 'No se pudo leer el archivo.';
      render();
    };
    reader.readAsText(file);
  }

  // ---------- Render ----------

  function renderSidebar(){
    var count = state.vehicles.length;
    var countText = count === 1 ? '1 activo' : count + ' activos';

    var items = state.vehicles.map(function(v){
      var s = summarize(v);
      var rendShort = s.rend === null ? '—' : pct(s.rend);
      var rendColor = s.rend === null ? 'var(--sidebar-tint)' : (s.rend >= 0 ? 'var(--good-soft)' : 'var(--bad-soft)');
      var active = v.id === state.selectedId && state.view === 'vehicle';
      var totalShort = s.mixed ? 'Varias monedas' : shortMoney(s.total, s.cur) + ' aportado';
      return '' +
        '<button type="button" class="vehicle-nav' + (active ? ' is-active' : '') + '" data-action="select-vehicle" data-id="' + v.id + '">' +
          '<div class="vehicle-nav-top">' +
            '<div class="vehicle-nav-name">' + escapeHtml(v.name) + '</div>' +
            '<div class="vehicle-nav-rend" style="color:' + rendColor + '">' + rendShort + '</div>' +
          '</div>' +
          '<div class="vehicle-nav-meta">' +
            '<span class="chip-type">' + escapeHtml(v.type) + '</span>' +
            '<span class="vehicle-nav-total">' + totalShort + '</span>' +
          '</div>' +
          (isStale(v) ? '<span class="stale-badge">Sin actualizar hace tiempo</span>' : '') +
        '</button>';
    }).join('');

    return '' +
      '<aside class="sidebar">' +
        '<div class="sidebar-head">' +
          '<div class="brand">Inversiones personales</div>' +
          '<div class="brand-sub">Seguimiento de inversiones</div>' +
        '</div>' +
        '<div class="nav-row">' +
          '<button type="button" class="nav-item' + (state.view === 'dashboard' ? ' is-active' : '') + '" data-action="open-dashboard">' +
            '<span class="nav-item-label">Dashboard</span>' +
            '<span class="nav-item-hint">Consolidado</span>' +
          '</button>' +
        '</div>' +
        '<div class="vehicles-head">' +
          '<span class="vehicles-head-label">Vehículos</span>' +
          '<span class="vehicles-head-count">' + countText + '</span>' +
        '</div>' +
        '<div class="vehicle-list">' +
          items +
          (count === 0 ? '<div class="empty-sidebar">Todavía no hay vehículos. Cree el primero para empezar a registrar aportes y valoraciones.</div>' : '') +
        '</div>' +
        '<div class="sidebar-foot">' +
          '<button type="button" class="btn-primary" data-action="new-vehicle">Nuevo vehículo</button>' +
          '<div class="privacy-note">Los datos viven únicamente en este navegador. No se envían a ningún servidor.</div>' +
          '<div class="export-row">' +
            (count > 0 ? '<button type="button" class="btn-link-sidebar" data-action="export-json">Exportar JSON</button>' : '') +
            (count > 0 ? '<button type="button" class="btn-link-sidebar" data-action="export-csv">Exportar CSV</button>' : '') +
            '<button type="button" class="btn-link-sidebar" data-action="import-json">Importar JSON</button>' +
          '</div>' +
          (state.importError ? '<div class="import-error">' + escapeHtml(state.importError) + '</div>' : '') +
          '<input type="file" id="import-file-input" accept="application/json" style="display:none;">' +
        '</div>' +
      '</aside>';
  }

  function renderMain(){
    if (state.view === 'dashboard') return renderDashboard();
    var v = selectedVehicle();
    if (v) return renderVehicle(v);
    return renderEmptySelection();
  }

  function renderDashboard(){
    var d = dashVals();
    var p = portfolioCOP();
    var stale = staleVehicles();
    var comp = comparisonRows();
    var div = diversification();

    var alertsHtml = stale.length ? (
      '<div class="section-eyebrow" style="margin-top:26px;">Alertas</div>' +
      '<div class="warning-box">' +
        (stale.length === 1 ? 'Un vehículo' : stale.length + ' vehículos') + ' sin actualizar hace más de 3 meses: ' +
        stale.map(function(v){ return escapeHtml(v.name) + ' (' + ageTextFromDays(daysSince(lastActivityDate(v))) + ')'; }).join(', ') + '.' +
      '</div>'
    ) : '';

    var comparisonHtml = '' +
      '<div class="section-eyebrow">Comparación de rendimiento</div>' +
      (comp.rows.length === 0
        ? '<div class="empty-box">Se necesita al menos un vehículo con aportes y valoración en una sola moneda para comparar rendimientos.</div>'
        : '<section class="card">' +
            '<div class="card-note" style="margin-bottom:12px;">Mejor desempeño: <strong style="color:var(--ink);">' + escapeHtml(comp.rows[0].name) + '</strong>' +
              (comp.rows.length > 1 ? ' — considere concentrar próximos aportes ahí si el perfil de riesgo es similar.' : '.') +
            '</div>' +
            '<div class="row-list">' +
              comp.rows.map(function(r, i){
                var rColor = r.rend >= 0 ? 'var(--good)' : 'var(--bad)';
                return '' +
                  '<button type="button" class="dash-row" data-action="open-vehicle" data-id="' + r.id + '">' +
                    '<span class="rank-medal">' + (i + 1) + '</span>' +
                    '<div style="flex:1;min-width:0;">' +
                      '<div class="dash-row-name">' + escapeHtml(r.name) + '</div>' +
                      '<div class="dash-row-type">' + escapeHtml(r.type) + '</div>' +
                    '</div>' +
                    '<div style="text-align:right;flex:none;">' +
                      '<div class="rank-pct" style="color:' + rColor + '">' + pct(r.rend) + '</div>' +
                      '<div class="rank-xirr">' + (r.xirrRate !== null ? 'TIR ' + pct(r.xirrRate) + ' anual' : 'TIR no calculable') + '</div>' +
                    '</div>' +
                  '</button>';
              }).join('') +
            '</div>' +
            (comp.excluded > 0 ? '<div class="excluded-note">' + comp.excluded + ' vehículo(s) no incluido(s) (falta valoración o tienen registros en varias monedas).</div>' : '') +
          '</section>'
      );

    var diversificationHtml = '' +
      '<div class="section-eyebrow">Diversificación del portafolio</div>' +
      (div.total === 0
        ? '<div class="empty-box">Registre aportes con tasa de cambio completa para ver la concentración del portafolio.</div>'
        : '<div class="grid-2">' +
            '<section class="card">' +
              '<h2 class="subsection-h">Por tipo de vehículo</h2>' +
              '<div style="margin-top:14px;">' +
                div.typeRows.map(function(r){
                  return '<div class="diversif-row">' +
                    '<span class="diversif-label" title="' + escapeHtml(r.label) + '">' + escapeHtml(r.label) + '</span>' +
                    '<div class="diversif-bar-wrap"><div class="diversif-bar" style="width:' + r.pct.toFixed(1) + '%;background:' + r.color + ';"></div></div>' +
                    '<span class="diversif-pct">' + r.pct.toFixed(1).replace('.', ',') + ' %</span>' +
                  '</div>';
                }).join('') +
              '</div>' +
              (div.topType && div.topType.pct >= 60 ? '<div class="excluded-note">Concentración alta: ' + div.topType.pct.toFixed(0) + ' % del portafolio aportado está en vehículos tipo «' + escapeHtml(div.topType.label) + '».</div>' : '') +
            '</section>' +
            '<section class="card">' +
              '<h2 class="subsection-h">Por moneda</h2>' +
              '<div style="margin-top:14px;">' +
                div.curRows.map(function(r){
                  return '<div class="diversif-row">' +
                    '<span class="diversif-label">' + escapeHtml(r.label) + '</span>' +
                    '<div class="diversif-bar-wrap"><div class="diversif-bar" style="width:' + r.pct.toFixed(1) + '%;background:' + r.color + ';"></div></div>' +
                    '<span class="diversif-pct">' + r.pct.toFixed(1).replace('.', ',') + ' %</span>' +
                  '</div>';
                }).join('') +
              '</div>' +
            '</section>' +
          '</div>' +
          (div.missingCount > 0 ? '<div class="conv-note" style="margin-top:10px;">' + div.missingCount + ' aporte(s) sin tasa de cambio no se incluyeron en este análisis.</div>' : '')
      );

    var portfolioHtml;
    if (p.vehiclesFull === 0) {
      portfolioHtml = '<div class="empty-box">Para ver el acumulado total en COP, cada vehículo necesita al menos un aporte con moneda/tasa completa y una valoración. ' +
        (p.totalVehicles > 0 ? 'Para vehículos en USD o GBP, registre la tasa de cambio al aporte o valoración.' : '') + '</div>';
    } else {
      var rendCopText = p.rend === null ? '—' : pct(p.rend);
      var rendCopColor = p.rend === null ? 'var(--faint)' : (p.rend >= 0 ? 'var(--good)' : 'var(--bad)');
      portfolioHtml = '' +
        '<div class="grid-3">' +
          '<div class="stat-card">' +
            '<div class="card-label">Total aportado (COP)</div>' +
            '<div class="stat-value">' + money(p.includedAportado, 'COP') + '</div>' +
            '<div class="stat-note">' + p.vehiclesFull + ' de ' + p.totalVehicles + ' vehículo(s) incluidos</div>' +
          '</div>' +
          '<div class="stat-card">' +
            '<div class="card-label">Valor actual (COP)</div>' +
            '<div class="stat-value">' + money(p.includedValor, 'COP') + '</div>' +
            '<div class="stat-note">Última valoración de cada vehículo incluido</div>' +
          '</div>' +
          '<div class="stat-card">' +
            '<div class="card-label">Rendimiento consolidado</div>' +
            '<div class="stat-value" style="color:' + rendCopColor + '">' + rendCopText + '</div>' +
            '<div class="stat-note">Valor actual vs. aportado, solo vehículos incluidos</div>' +
          '</div>' +
        '</div>' +
        (p.excludedNames.length ? '<div class="excluded-note">No incluidos en este consolidado (falta tasa de cambio o valoración): ' + p.excludedNames.map(escapeHtml).join(', ') + '.</div>' : '');
    }

    var currencyRow = d.multiCurrency ? (
      '<div class="currency-row">' +
        '<span class="currency-row-label">Moneda:</span>' +
        d.currencies.map(function(c){
          return '<button type="button" class="currency-pill' + (c.active ? ' is-active' : '') + '" data-action="select-currency" data-currency="' + c.label + '">' + c.label + '</button>';
        }).join('') +
      '</div>'
    ) : '';

    var rowsHtml = d.noRows
      ? '<div class="empty-box">Todavía no hay aportes registrados en esta moneda.</div>'
      : d.rows.map(function(r){
          return '' +
            '<button type="button" class="dash-row" data-action="open-vehicle" data-id="' + r.id + '">' +
              '<span class="dash-row-dot" style="background:' + r.color + '"></span>' +
              '<div style="flex:1;min-width:0;">' +
                '<div class="dash-row-name">' + escapeHtml(r.name) + '</div>' +
                '<div class="dash-row-type">' + escapeHtml(r.type) + '</div>' +
              '</div>' +
              '<div style="text-align:right;flex:none;">' +
                '<div class="dash-row-amount">' + r.amountText + '</div>' +
                '<div class="dash-row-pct">' + r.pctText + '</div>' +
              '</div>' +
            '</button>';
        }).join('');

    return '' +
      '<div class="page">' +
        '<div class="eyebrow">Consolidado del portafolio</div>' +
        '<h1 class="page-title">Dashboard</h1>' +

        '<div class="section-eyebrow" style="margin-top:26px;">Portafolio total, convertido a COP</div>' +
        portfolioHtml +

        alertsHtml +
        comparisonHtml +
        diversificationHtml +

        '<div class="section-eyebrow">Detalle por moneda original</div>' +
        currencyRow +
        '<div class="grid-2">' +
          '<section class="card">' +
            '<div class="card-label">Total invertido</div>' +
            '<div class="card-value">' + d.totalText + '</div>' +
            '<div class="card-note">' + d.totalNote + '</div>' +
            '<div class="pie-wrap">' +
              '<div class="pie" style="background:' + d.pieGradient + '">' +
                '<div class="pie-hole">' +
                  '<div class="pie-hole-num">' + d.sliceCount + '</div>' +
                  '<div class="pie-hole-label">Vehículos</div>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="pie-note">' + d.pieNote + '</div>' +
          '</section>' +
          '<section class="card">' +
            '<div class="section-head">' +
              '<h2>Participación por vehículo</h2>' +
              '<span class="section-head-hint">' + d.currencyLabel + '</span>' +
            '</div>' +
            '<div class="row-list">' + rowsHtml + '</div>' +
            (d.hasExcluded ? '<div class="excluded-note">' + d.excludedText + '</div>' : '') +
          '</section>' +
        '</div>' +
      '</div>';
  }

  function renderVehicle(v){
    var s = summarize(v);
    var subjective = isSubjective(v);
    var aportes = recordsOf(v, 'aporte');
    var valoraciones = recordsOf(v, 'valoracion');

    var totalTextVal = totalText(v, s);
    var aporteCountText = v.aportes.length === 0 ? 'Sin aportes' : (v.aportes.length === 1 ? '1 aporte registrado' : v.aportes.length + ' aportes registrados');
    var lastValText = s.last ? money(s.last.amount, s.last.currency) : '—';
    var lastValDateText = s.last ? dateText(s.last.date) + ' · ' + ageText(s.last.date) : 'Sin valoraciones registradas';
    var rendText = s.rend === null ? '—' : pct(s.rend);
    var rendColor = s.rend === null ? 'var(--faint)' : (s.rend >= 0 ? 'var(--good)' : 'var(--bad)');
    var rendNote = s.rend === null
      ? (s.mixed ? 'Registros en varias monedas' : (v.aportes.length === 0 ? 'Falta registrar aportes' : 'Falta una valoración para calcularlo'))
      : (subjective ? 'Sobre un valor estimado por usted' : 'Última valoración vs. total aportado');

    var xirrHtml = '';
    if (s.rend !== null) {
      var xirrText = s.xirrRate === null ? 'no se pudo calcular' : '<strong>' + pct(s.xirrRate) + ' anual</strong>';
      xirrHtml = '<div class="stat-sub">TIR anualizada (XIRR): ' + xirrText + '</div>';
    }

    var totalCopNote = '';
    if (s.cur !== 'COP' && v.aportes.length > 0) {
      totalCopNote = s.totalCOPMissing === 0
        ? '<div class="conv-note">≈ ' + money(s.totalCOP, 'COP') + ' con la tasa registrada</div>'
        : '<div class="conv-note">' + s.totalCOPMissing + ' aporte(s) sin tasa de cambio registrada</div>';
    }
    var lastValCopNote = '';
    if (s.cur !== 'COP' && s.last) {
      lastValCopNote = s.lastValCOP !== null
        ? '<div class="conv-note">≈ ' + money(s.lastValCOP, 'COP') + '</div>'
        : '<div class="conv-note">Sin tasa de cambio registrada</div>';
    }

    var staleHtml = isStale(v)
      ? '<div class="warning-box">Este vehículo no se actualiza hace ' + ageTextFromDays(daysSince(lastActivityDate(v))) + '. Considere registrar una valoración reciente.</div>'
      : '';

    var series = chartSeries(v, s);
    var chartHtml = '';
    if (series === null) {
      chartHtml = s.mixed
        ? '<div class="chart-empty">La gráfica no está disponible cuando hay registros en más de una moneda.</div>'
        : '<div class="chart-empty">Registre aportes o valoraciones para ver la evolución.</div>';
    } else if (!series.valPoints.length) {
      chartHtml = '<div class="chart-empty">Registre al menos una valoración para ver la evolución del valor.</div>';
    } else {
      chartHtml = renderChartSvg(series) +
        '<div class="chart-legend">' +
          '<span class="chart-legend-item"><span class="chart-legend-swatch" style="border-color:#FF6A14;border-top-style:dashed;"></span>Total aportado (acumulado)</span>' +
          '<span class="chart-legend-item"><span class="chart-legend-swatch" style="border-color:#003A70;"></span>Valor registrado</span>' +
        '</div>';
    }

    function recordRows(list, kind){
      if (!list.length) {
        var msg = kind === 'aporte'
          ? 'Sin aportes registrados. Registre el primero con fecha, monto y moneda.'
          : 'Sin valoraciones registradas. Mientras no exista una, no se muestra ningún porcentaje de rendimiento.';
        return '<div class="empty-box">' + msg + '</div>';
      }
      return list.map(function(r){
        return '' +
          '<div class="record-row">' +
            '<div style="flex:1;min-width:0;">' +
              '<div class="record-amount">' + r.amountText + '</div>' +
              '<div class="record-meta">' + r.metaText + '</div>' +
            '</div>' +
            '<button type="button" class="btn-text" data-action="edit-record" data-kind="' + kind + '" data-id="' + r.id + '">Editar</button>' +
            '<button type="button" class="btn-text danger" data-action="delete-record" data-kind="' + kind + '" data-id="' + r.id + '">Borrar</button>' +
          '</div>';
      }).join('');
    }

    return '' +
      '<div class="page">' +
        '<div class="vehicle-head">' +
          '<div style="min-width:0;">' +
            '<div class="vehicle-head-badges">' +
              '<span class="chip-generic">' + escapeHtml(v.type) + '</span>' +
              (subjective ? '<span class="chip-warn">Valor estimado</span>' : '') +
            '</div>' +
            '<h1 class="page-title">' + escapeHtml(v.name) + '</h1>' +
          '</div>' +
          '<div class="vehicle-actions">' +
            '<button type="button" class="btn-ghost" data-action="edit-vehicle">Editar vehículo</button>' +
            '<button type="button" class="btn-ghost danger" data-action="delete-vehicle">Borrar</button>' +
          '</div>' +
        '</div>' +

        '<div class="grid-3">' +
          '<div class="stat-card">' +
            '<div class="card-label">Total aportado</div>' +
            '<div class="stat-value" style="white-space:normal;">' + totalTextVal + '</div>' +
            '<div class="stat-note">' + aporteCountText + '</div>' +
            totalCopNote +
          '</div>' +
          '<div class="stat-card">' +
            '<div class="card-label">Última valoración</div>' +
            '<div class="stat-value">' + lastValText + '</div>' +
            '<div class="stat-note">' + lastValDateText + '</div>' +
            lastValCopNote +
          '</div>' +
          '<div class="stat-card">' +
            '<div class="card-label">Rendimiento acumulado</div>' +
            '<div class="stat-value" style="color:' + rendColor + '">' + rendText + '</div>' +
            '<div class="stat-note">' + rendNote + '</div>' +
            xirrHtml +
          '</div>' +
        '</div>' +

        (s.mixed ? '<div class="warning-box">Este vehículo tiene registros en más de una moneda, por eso el rendimiento y la TIR no se calculan aquí. Cada aporte y valoración sí puede convertirse a COP por separado si le asigna una tasa de cambio.</div>' : '') +
        staleHtml +

        '<div class="section-eyebrow">Evolución del valor</div>' +
        '<section class="card chart-card">' + chartHtml + '</section>' +

        '<div class="grid-records">' +
          '<section class="card">' +
            '<div class="section-head">' +
              '<h2>Aportes</h2>' +
              '<button type="button" class="btn-ghost" style="background:var(--navy);border-color:var(--navy);color:#fff;padding:9px 14px;" data-action="new-aporte">Registrar aporte</button>' +
            '</div>' +
            '<div class="record-list">' + recordRows(aportes, 'aporte') + '</div>' +
          '</section>' +
          '<section class="card">' +
            '<div class="section-head">' +
              '<h2>Valoraciones</h2>' +
              '<button type="button" class="btn-ghost" style="background:var(--navy);border-color:var(--navy);color:#fff;padding:9px 14px;" data-action="new-valoracion">Registrar valoración</button>' +
            '</div>' +
            '<div class="record-list">' + recordRows(valoraciones, 'valoracion') + '</div>' +
          '</section>' +
        '</div>' +

        '<div class="roadmap-note">' +
          '<div class="roadmap-tag">Fase 2</div>' +
          '<div class="roadmap-text">Esta versión calcula la TIR (XIRR), convierte a COP con tasa manual, muestra la evolución del valor, compara vehículos entre sí, avisa de vehículos sin actualizar y analiza la diversificación del portafolio. Los datos pueden exportarse e importarse como respaldo desde el panel lateral.</div>' +
        '</div>' +
      '</div>';
  }

  function renderEmptySelection(){
    return '' +
      '<div class="empty-state">' +
        '<div class="empty-state-inner">' +
          '<h1>Empiece por un vehículo</h1>' +
          '<p>Cree un vehículo de inversión con su nombre y tipo — a2censo, CDT, acciones, un inmueble — y registre después sus aportes y valoraciones.</p>' +
          '<button type="button" class="btn-cta" data-action="new-vehicle">Nuevo vehículo</button>' +
        '</div>' +
      '</div>';
  }

  function renderModal(){
    var m = state.modal;
    var titles = {
      vehicle: m.editId ? 'Editar vehículo' : 'Nuevo vehículo de inversión',
      aporte: m.editId ? 'Editar aporte' : 'Registrar aporte',
      valoracion: m.editId ? 'Editar valoración' : 'Registrar valoración'
    };
    var subs = {
      vehicle: 'El tipo es texto libre: escriba el que use usted, no hay catálogo cerrado.',
      aporte: 'Dinero que entra a la inversión, en la moneda en que lo aportó.',
      valoracion: 'Valor actual del activo en esa fecha. Puede registrarlo cuando quiera, no solo al aportar.'
    };
    var isVehicle = m.kind === 'vehicle';
    var amountLabel = m.kind === 'valoracion' ? 'Valor del activo' : 'Monto aportado';

    var fields = isVehicle ? (
      '<div class="field-group">' +
        '<label class="field">Nombre' +
          '<input id="modal-name" value="' + escapeHtml(m.name || '') + '" placeholder="a2censo — Operación XYZ">' +
        '</label>' +
        '<label class="field">Tipo (texto libre)' +
          '<input id="modal-type" value="' + escapeHtml(m.type || '') + '" placeholder="a2censo, CDT, Acciones, Inmueble…">' +
        '</label>' +
      '</div>'
    ) : (
      '<div class="field-group">' +
        '<label class="field">Fecha' +
          '<input id="modal-date" type="date" value="' + escapeHtml(m.date || '') + '">' +
        '</label>' +
        '<div class="field-row">' +
          '<label class="field">' + amountLabel +
            '<input id="modal-amount" value="' + escapeHtml(m.amount || '') + '" placeholder="0">' +
          '</label>' +
          '<label class="field">Moneda' +
            '<select id="modal-currency">' +
              ['COP','USD','GBP'].map(function(c){ return '<option value="' + c + '"' + (((m.currency || 'COP') === c) ? ' selected' : '') + '>' + c + '</option>'; }).join('') +
            '</select>' +
          '</label>' +
        '</div>' +
        (m.currency && m.currency !== 'COP' ? (
          '<label class="field">Tasa de cambio a COP (opcional)' +
            '<span class="field-hint">1 ' + escapeHtml(m.currency) + ' = ¿cuántos COP? Déjelo vacío si no la tiene a mano.</span>' +
            '<input id="modal-fxrate" value="' + escapeHtml(m.fxRate || '') + '" placeholder="Ej: 4100">' +
          '</label>'
        ) : '') +
      '</div>'
    );

    return '' +
      '<div class="overlay">' +
        '<div class="modal">' +
          '<h2>' + titles[m.kind] + '</h2>' +
          '<div class="modal-sub">' + subs[m.kind] + '</div>' +
          '<div class="modal-fields">' +
            fields +
            (m.error ? '<div class="field-error">' + escapeHtml(m.error) + '</div>' : '') +
          '</div>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-cancel" data-action="close-modal">Cancelar</button>' +
            '<button type="button" class="btn-save" data-action="save-modal">Guardar</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderConfirm(){
    var c = state.confirm;
    return '' +
      '<div class="overlay is-confirm">' +
        '<div class="modal is-confirm">' +
          '<h2>' + escapeHtml(c.title) + '</h2>' +
          '<p class="modal-body">' + escapeHtml(c.body) + '</p>' +
          '<div class="modal-actions">' +
            '<button type="button" class="btn-cancel" data-action="close-confirm">Cancelar</button>' +
            '<button type="button" class="btn-danger" data-action="confirm-delete">Sí, borrar</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  // ---------- Delegación de eventos ----------
  root.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var v, r;

    switch (action) {
      case 'open-dashboard': openDashboard(); break;
      case 'select-vehicle': selectVehicle(el.getAttribute('data-id')); break;
      case 'open-vehicle': selectVehicle(el.getAttribute('data-id')); break;
      case 'select-currency': state.dashCurrency = el.getAttribute('data-currency'); render(); break;
      case 'new-vehicle': openModal({ kind: 'vehicle', name: '', type: '' }); break;
      case 'edit-vehicle':
        v = selectedVehicle();
        if (v) openModal({ kind: 'vehicle', editId: v.id, name: v.name, type: v.type });
        break;
      case 'delete-vehicle':
        v = selectedVehicle();
        if (v) askDelete({ kind: 'vehicle', vehicleId: v.id, title: 'Borrar el vehículo',
          body: 'Se eliminará «' + v.name + '» junto con todos sus aportes y valoraciones. No hay forma de deshacer esta acción.' });
        break;
      case 'new-aporte':
        v = selectedVehicle();
        if (v) openModal({ kind: 'aporte', vehicleId: v.id, date: today(), amount: '', currency: summarize(v).cur, fxRate: '' });
        break;
      case 'new-valoracion':
        v = selectedVehicle();
        if (v) openModal({ kind: 'valoracion', vehicleId: v.id, date: today(), amount: '', currency: summarize(v).cur, fxRate: '' });
        break;
      case 'edit-record':
        v = selectedVehicle();
        if (v) {
          var kind = el.getAttribute('data-kind');
          var listKey = kind === 'aporte' ? 'aportes' : 'valoraciones';
          r = v[listKey].find(function(x){ return x.id === el.getAttribute('data-id'); });
          if (r) openModal({ kind: kind, vehicleId: v.id, editId: r.id, date: r.date, amount: String(r.amount), currency: r.currency, fxRate: r.fxRate != null ? String(r.fxRate) : '' });
        }
        break;
      case 'delete-record':
        v = selectedVehicle();
        if (v) {
          var kind2 = el.getAttribute('data-kind');
          var listKey2 = kind2 === 'aporte' ? 'aportes' : 'valoraciones';
          r = v[listKey2].find(function(x){ return x.id === el.getAttribute('data-id'); });
          if (r) askDelete({ kind: kind2, vehicleId: v.id, id: r.id,
            title: kind2 === 'aporte' ? 'Borrar este aporte' : 'Borrar esta valoración',
            body: 'Se eliminará el registro de ' + money(r.amount, r.currency) + ' del ' + dateText(r.date) + '. No hay forma de deshacer esta acción.' });
        }
        break;
      case 'close-modal': closeModal(); break;
      case 'save-modal': saveModal(); break;
      case 'close-confirm': closeConfirm(); break;
      case 'confirm-delete': doConfirm(); break;
      case 'export-json':
        downloadFile('seguimiento-inversiones.json', buildExportJSON(), 'application/json');
        break;
      case 'export-csv':
        downloadFile('seguimiento-inversiones.csv', buildExportCSV(), 'text/csv');
        break;
      case 'import-json':
        var fileInput = document.getElementById('import-file-input');
        if (fileInput) fileInput.click();
        break;
    }
  });

  root.addEventListener('change', function(e){
    if (e.target && e.target.id === 'import-file-input') {
      var file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (file) handleImportFile(file);
      return;
    }
    if (e.target && e.target.id === 'modal-currency' && state.modal) {
      var m = state.modal;
      var dateEl = document.getElementById('modal-date');
      var amountEl = document.getElementById('modal-amount');
      var fxEl = document.getElementById('modal-fxrate');
      if (dateEl) m.date = dateEl.value;
      if (amountEl) m.amount = amountEl.value;
      if (fxEl) m.fxRate = fxEl.value;
      m.currency = e.target.value;
      m.error = '';
      render();
    }
  });

  root.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      if (state.confirm) { closeConfirm(); return; }
      if (state.modal) { closeModal(); return; }
    }
    if (e.key === 'Enter' && state.modal) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'select') { e.preventDefault(); saveModal(); }
    }
  });

  load();
  render();
})();
</script>
